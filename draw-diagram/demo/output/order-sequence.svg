<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" class="slide" role="img"><style>/* Diagram styles: white canvas, bright fills, bold labels, solid directional arrows. */
.slide { display: block; width: 100%; height: auto; background: #fff; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.slide text { dominant-baseline: central; text-anchor: middle; }
.slide-box-label { font-size: 20px; font-weight: 700; fill: #111; }
.slide-box--sm .slide-box-label { font-size: 9.5px; }
.slide-box-value { font-size: 13px; font-weight: 500; fill: #1d2125; }
.slide-box-label.is-muted, .slide-box-value.is-muted { fill: #5d6670; }
.slide-badge { font-size: 13px; font-weight: 800; }
.slide-group-title { font-size: 16px; font-weight: 700; fill: #111; }
.slide-arrow { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }
.slide-arrow--sm { stroke-width: 1.6; }
.slide-arrow--blocked { stroke: #e0245e; stroke-dasharray: 9 7; }
/* 返回/响应（reply）用虚线：UML 交互图里同步调用是实线、返回是虚线；箭头形状（实心/开放）由 diagram.js 的 heads 决定。 */
.slide-arrow--reply { stroke-dasharray: 9 7; }
.slide-arrow-label { font-size: 14px; font-weight: 600; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.slide-arrow-label--blocked { fill: #c41d4f; }
.slide-note { font-size: 13px; font-weight: 500; fill: #5d6670; }
.slide-note--warn { fill: #c41d4f; font-weight: 700; }
/* 生命线（时序风格）与结束短杠：压暗虚线，只做时间轴示意，不表示关系强度。 */
.slide-lifeline { fill: none; stroke: #111; stroke-width: 1.5; stroke-dasharray: 7 7; opacity: .35; }
.slide-lifeline-end { fill: none; stroke: #111; stroke-width: 1.5; opacity: .35; }
</style><title>下单时序：请求与应答</title><defs><marker id="diagram-5-head-flow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-5-head-flow-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-5-head-async" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 11.5 6 L 0.5 11" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="diagram-5-head-async-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 11.5 6 L 0.5 11" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="diagram-5-head-reply" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 11.5 6 L 0.5 11" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="diagram-5-head-reply-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 11.5 6 L 0.5 11" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="diagram-5-head-blocked" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><marker id="diagram-5-head-blocked-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><filter id="diagram-5-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-lifelines"><path d="M 150 88 L 150 420" class="slide-lifeline"/><path d="M 143 420 L 157 420" class="slide-lifeline-end"/><path d="M 360 88 L 360 420" class="slide-lifeline"/><path d="M 353 420 L 367 420" class="slide-lifeline-end"/><path d="M 570 88 L 570 420" class="slide-lifeline"/><path d="M 563 420 L 577 420" class="slide-lifeline-end"/></g><g class="slide-arrows"><path d="M 150 150 L 354 150" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-5-head-flow)"/><path d="M 360 190 L 440 190 Q 450 190 450 200 L 450 230 Q 450 240 440 240 L 366 240" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-5-head-flow)"/><path d="M 360 290 L 564 290" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-5-head-flow)"/><path d="M 570 340 L 366 340" class="slide-arrow slide-arrow--reply" marker-end="url(#diagram-5-head-reply)"/><path d="M 360 390 L 156 390" class="slide-arrow slide-arrow--reply" marker-end="url(#diagram-5-head-reply)"/></g><g class="slide-boxes"><g class="slide-box" data-id="client" data-shape="rect"><rect x="75" y="24" width="150" height="64" rx="20" class="slide-shape" fill="#3fb8ff" stroke="none" stroke-width="3"/><text x="150" y="56" class="slide-box-label"><tspan x="150" dy="0em">客户端</tspan></text></g><g class="slide-box" data-id="order" data-shape="rect"><rect x="285" y="24" width="150" height="64" rx="20" class="slide-shape" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="360" y="56" class="slide-box-label"><tspan x="360" dy="0em">订单服务</tspan></text></g><g class="slide-box" data-id="warehouse" data-shape="rect"><rect x="495" y="24" width="150" height="64" rx="20" class="slide-shape" fill="#ff3d9e" stroke="none" stroke-width="3"/><text x="570" y="56" class="slide-box-label"><tspan x="570" dy="0em">仓储服务</tspan></text></g></g><g class="slide-arrow-labels"><text x="255" y="133" class="slide-arrow-label slide-arrow-label--flow"><tspan x="255" dy="0em">1 提交订单</tspan></text><text x="405" y="220" class="slide-arrow-label slide-arrow-label--flow"><tspan x="405" dy="0em">2 校验订单</tspan></text><text x="465" y="273" class="slide-arrow-label slide-arrow-label--flow"><tspan x="465" dy="0em">3 预留库存</tspan></text><text x="465" y="323" class="slide-arrow-label slide-arrow-label--reply"><tspan x="465" dy="0em">4 库存结果</tspan></text><text x="255" y="373" class="slide-arrow-label slide-arrow-label--reply"><tspan x="255" dy="0em">5 下单结果</tspan></text></g></svg>