<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>交付与运营 · 通用图解 Demo</title><style>
body { margin: 0; background: #f4f5f7; color: #20252c; font: 16px/1.6 system-ui, sans-serif; }
main { max-width: 960px; margin: 32px auto; padding: 0 16px; }
h1 { margin-bottom: 8px; } h2 { font-size: 20px; }
.preview-frame { margin: 28px 0; }
.preview-slide { max-width: 720px; border: 1px solid #d4d8df; border-radius: 12px; overflow: hidden; }
.preview-check { padding-left: 24px; font-size: 14px; }
[data-level=error] { color: #a92c3b; } [data-level=ok] { color: #17634a; }
@media (max-width: 500px) { main { margin: 16px auto; padding: 0 12px; } }

/* Diagram styles: white canvas, bright fills, bold labels, solid directional arrows. */
.slide { display: block; width: 100%; height: auto; background: #fff; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.slide text { dominant-baseline: central; text-anchor: middle; }
.slide-box-label { font-size: 20px; font-weight: 700; fill: #111; }
.slide-box--sm .slide-box-label { font-size: 9.5px; }
.slide-box-value { font-size: 13px; font-weight: 500; fill: #1d2125; }
/* 生命线脚注框（lifelines[].foot）：参与者盒子的视觉副本，装饰而非节点。类名全部独立于
   .slide-box/.slide-group/.slide-shape/.slide-arrow 两族，检查器选择器看不到它，因此不会触发
   文字溢出/框重叠/穿框等几何判定；填充与描边照搬主盒（在 diagram.js 里作为属性给出）。
   块内顺序即优先级：ER 单元格同时带 .slide-foot-member 与 .slide-foot-key/.slide-foot-type，
   三者都是「元素 + 类」，靠「来源顺序在后」让 key 加粗、type 右对齐（与主盒 ER 列同款）。 */
.slide-foot-label { font-size: 20px; font-weight: 700; fill: #111; }
.slide-foot--sm .slide-foot-label { font-size: 9.5px; }
.slide-foot-value { font-size: 13px; font-weight: 500; fill: #1d2125; }
.slide text.slide-foot-member { font-size: 13px; font-weight: 500; fill: #1d2125; text-anchor: start; }
.slide text.slide-foot-key { font-weight: 600; }
.slide text.slide-foot-type { fill: #5d6670; text-anchor: end; }
.slide-foot-divider { stroke: #111; stroke-width: 1.2; opacity: .25; }
.slide-foot-label.is-muted, .slide-foot-value.is-muted { fill: #5d6670; }
/* 类图分栏：成员行左对齐小字，分隔线为压暗细线 */
.slide text.slide-box-member { font-size: 13px; font-weight: 500; fill: #1d2125; text-anchor: start; }
/* ER 行三列：key 列加粗，type 列压暗并右对齐（与 member 同优先级、靠后出现以覆盖 text-anchor） */
.slide text.slide-box-key { font-weight: 600; }
.slide text.slide-box-type { fill: #5d6670; text-anchor: end; }
.slide-box-divider { stroke: #111; stroke-width: 1.2; opacity: .25; }
.slide-box-label.is-muted, .slide-box-value.is-muted { fill: #5d6670; }
/* 节点图标：与文字同墨色的线条图标，位于框顶，不占语义 */
.slide-icon { fill: none; stroke: #111; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.slide-badge { font-size: 13px; font-weight: 800; }
.slide-group-title { font-size: 16px; font-weight: 700; fill: #111; }
/* 左对齐标题（group.titleAlign: 'left'）：用「元素 + 类」同优先级选择器压过 `.slide text` 的 text-anchor: middle */
.slide text.slide-group-title.is-left { text-anchor: start; }
.slide-arrow { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }
.slide-arrow--sm { stroke-width: 1.6; }
.slide-arrow--blocked { stroke: #e0245e; stroke-dasharray: 9 7; }
/* 返回/响应（reply）用虚线：UML 交互图里同步调用是实线、返回是虚线；箭头形状（实心/开放）由 diagram.js 的 heads 决定。 */
.slide-arrow--reply { stroke-dasharray: 9 7; }
.slide-arrow-label { font-size: 14px; font-weight: 600; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.slide-arrow-label--blocked { fill: #c41d4f; }
.slide-note { font-size: 13px; font-weight: 500; fill: #5d6670; }
.slide-note--warn { fill: #c41d4f; font-weight: 700; }
/* 泳道泳池：标题带与道间分隔线，弱化描边不抢流程 */
.slide-swimlane-title { font-size: 16px; font-weight: 700; fill: #111; }
.slide-swimlane-sep { fill: none; stroke: #1b1b1b; stroke-width: 1.2; opacity: .45; }
/* 生命线（时序风格）与结束短杠：压暗虚线，只做时间轴示意，不表示关系强度。 */
.slide-lifeline { fill: none; stroke: #111; stroke-width: 1.5; stroke-dasharray: 7 7; opacity: .35; }
.slide-lifeline-end { fill: none; stroke: #111; stroke-width: 1.5; opacity: .35; }
/* 激活条：生命线上的执行窄条，14 宽、以时间轴为中心；压暗填充让它读作「正在执行」而不是新节点。
   类名避开 .slide-shape/.slide-box/.slide-group/.slide-arrow，几何检查完全不看它。 */
.slide-activation { fill: #dde3e8; stroke: #111; stroke-width: 1.2; }
/* 交互片段框（Alt/Opt/Loop/Par）：白色半透明面板 + 左上角标签条 + 可选守卫/操作符文字。
   面板是片段底衬，排在生命线之前（见 diagram.js），消息线、生命线与激活条因此都画在它之上、
   一个像素都不会被它的白底洗淡；面板自身 92% 不透明度的描边仍足以让四条边框（含底边）清晰可辨。 */
.slide-fragment { fill: #fff; opacity: .92; stroke: #111; stroke-width: 1.5; }
/* fragments[].dashed: 虚线外框（次要/试探性的组合片段），仅换描边线型，不透明度与宽度不变 */
.slide-fragment.is-dashed { stroke-dasharray: 9 7; }
.slide-fragment-tab { fill: #eceff2; stroke: #111; stroke-width: 1.5; }
/* fragments[].sections 的分区虚线：标签条以下每段的段间分隔线，横向从外框内缘到内缘（x+1 → x+w−1） */
.slide-fragment-divider { fill: none; stroke: #111; stroke-width: 1.2; opacity: .5; stroke-dasharray: 6 5; }
/* 左对齐/右对齐文本：`.slide text` 的 text-anchor: middle 同优先级，必须用「元素 + 类」才覆盖得住 */
.slide text.slide-fragment-tab-text { font-size: 14px; font-weight: 700; fill: #111; text-anchor: start; }
.slide text.slide-fragment-guard { font-size: 14px; fill: #111; text-anchor: start; }
.slide text.slide-fragment-op { font-size: 14px; fill: #111; text-anchor: end; }
</style>
<script>window.__diagramErrors = []; addEventListener('error', e => __diagramErrors.push(e.message));</script>
<script>(() => {
  'use strict';
  // Fixed-geometry diagram renderer; routing uses explicit anchors and control points.
  // 连线写法：from/to 为「框id@边[:位置0~1]」，shape 为 arc（弧线连接）、elbow（直角折线）或 line（直线）。
  // 时序风格：diagram.lifelines 声明节点生命线（虚线，纯装饰），连线用「id@life:y」锚在生命线高度上；
  // 两条生命线之间的消息默认走直线，同一条生命线上的两端自动画成自调用环。
  // 进阶时序：diagram.activations 在生命线上加执行激活条，diagram.fragments 画 Alt/Opt/Loop/Par 组合片段框；
  // 片段框可用 sections 分若干 operands（段间虚线分隔、每段自带 guard），dashed 换虚线外框；
  // lifelines[].foot 把生命线收在脚注 y 上并放一个参与者盒子的视觉副本；box.icon: 'actor' 是火柴人参与者。
  // 以上都是装饰（不进 content、不参与语义比对与几何检查）。层级：泳道/生命线之上是激活条，再是箭头与节点；
  // 脚注副本与主盒同层（箭头之上）；片段框是底衬，排在泳道/生命线之前，这样框内的生命线、激活条与消息线都不会被半透明白底洗淡。
  // 分组边界：group.dashed 用虚线描边，group.titleAlign: 'left' 让标题左对齐（默认为居中）。
  // 节点写法：box.shape 为 rect（默认）、pill、diamond 或 ellipse；锚点与角标按该形状的边界计算。
  const svgNS = 'http://www.w3.org/2000/svg';
  // Bright fills keep black labels legible; assign colors consistently by concept.
  const fills = {
    mint: '#00e5cc', mintSoft: '#84f0dc', mintPale: '#c9f7ec',
    pink: '#ff3d9e', pinkSoft: '#ff80c4', pinkPale: '#ffd0e8',
    violet: '#a98bff', violetSoft: '#cbb9ff', violetPale: '#ebe4ff',
    sky: '#3fb8ff', skySoft: '#93d6ff', skyPale: '#d6efff',
    amber: '#ffb020', amberSoft: '#ffd27a', amberPale: '#ffefcc',
    gray: '#e4e8eb'
  };
  // dy 是字形墨迹中心相对圆心的修正量：`dominant-baseline: central` 对齐的是 em 盒中心，
  // 而 × ✓ ? 的墨迹在 em 盒里并不居中（800 13px PingFang/Helvetica 用 canvas measureText 实测：
  // 墨迹中心分别比 em 中心低 1.6 / 0.5 / 0.3px），不修正时 × 明显偏下。
  const badges = {
    error: { fill: '#e5484d', glyph: '×', ink: '#fff', dy: -1.6 },
    ok: { fill: '#18a058', glyph: '✓', ink: '#fff', dy: -0.5 },
    warn: { fill: '#f5a524', glyph: '?', ink: '#1a1a1a', dy: -0.3 }
  };
  // 关系线型按语义选：flow 同步/调用（实线实心箭头）、async 异步（实线开放箭头）、
  // reply 返回/响应（虚线开放箭头，虚线样式在 diagram.css）、blocked 阻断失败（红色虚线）。
  // 同步用实心三角、异步与返回用开放箭头，是 UML 交互图的通行画法。
  const heads = {
    flow: { color: '#111', open: false },
    async: { color: '#111', open: true },
    reply: { color: '#111', open: true },
    blocked: { color: '#e0245e', open: false },
    // many：ER 一对多的鸦脚，落在「多」的一侧（箭头端）；三爪从线尾处张开，与实心箭头共用 6px 落点约定
    many: { color: '#111', foot: true },
    // one：ER「一」侧的端部短杠；refX=11 让竖杠正好压在框边界上（route 中末端 gap 取 0）
    one: { color: '#111', bar: true, refX: 11 }
  };
  // 起点端标记：compose/aggregate 为 UML 类图菱形（贴着「整体」一侧的框边），
  // one/many 为 ER 起点端的短杠/鸦脚（扇向源头框）；每项自带 path 与样式，marker refX=0 沿路径向前铺开
  const startHeads = {
    compose: { d: 'M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z', fill: '#111', stroke: 'none', width: 1.4 },
    aggregate: { d: 'M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z', fill: '#fff', stroke: '#111', width: 1.4 },
    one: { d: 'M 0.8 0.8 L 0.8 11.2', fill: 'none', stroke: '#111', width: 2.4 },
    many: { d: 'M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2', fill: 'none', stroke: '#111', width: 1.7, linecap: 'round' }
  };
  const arrowKinds = new Set(Object.keys(heads));
  // 交互片段框（UML combined fragment）：字形沿用规范符号，标签文字用英文缩写；
  // 与生命线、泳道分隔线一样是装饰，不进 content、不参与语义比对，也不进几何判定。
  const fragmentKinds = {
    alt: { glyph: '◇', label: 'Alt' },
    opt: { glyph: '◇', label: 'Opt' },
    loop: { glyph: '↻', label: 'Loop' },
    par: { glyph: '=', label: 'Par' }
  };
  // 节点图标：24×24 网格的线条图标（stroke 风格，与文字同墨色），box.icon 选用；纯视觉，不进 content
  const icons = {
    database: [
      { d: 'M12 3C6.8 3 3.4 4.5 3.4 6.3v11.4C3.4 19.5 6.8 21 12 21s8.6-1.5 8.6-3.3V6.3C20.6 4.5 17.2 3 12 3Z' },
      { d: 'M3.4 6.3C3.4 8.1 6.8 9.6 12 9.6s8.6-1.5 8.6-3.3' },
      { d: 'M3.4 12c0 1.8 3.4 3.3 8.6 3.3s8.6-1.5 8.6-3.3' }
    ],
    queue: [
      { d: 'M3.5 6.5h10.5' }, { d: 'M3.5 12h10.5' }, { d: 'M3.5 17.5h10.5' },
      { d: 'M15.5 12h5M18.2 9.6 20.6 12l-2.4 2.4' }
    ],
    user: [
      { cx: 12, cy: 7.4, r: 3.6 },
      { d: 'M4.8 20.4c.6-4.4 3.4-6.6 7.2-6.6s6.6 2.2 7.2 6.6' }
    ],
    cloud: [
      { d: 'M7.2 18.6a4.3 4.3 0 0 1-.8-8.5 5.6 5.6 0 0 1 10.8-1.6 4.1 4.1 0 0 1 1.1 10.1Z' }
    ],
    // actor：时序图参与者火柴人（头 + 躯干 + 双臂 + 双腿）。五笔都在 24×24 网格内居中：
    // 头心 (12,4.6) r 3.4，躯干 8→15.4，双臂 y 11.2 横跨 4.6→19.4，双腿从胯 (12,15.4) 斜到脚跟 (6.8/17.2,21.4)
    actor: [
      { cx: 12, cy: 4.6, r: 3.4 },
      { d: 'M12 8v7.4' },
      { d: 'M4.6 11.2h14.8' },
      { d: 'M12 15.4 6.8 21.4' },
      { d: 'M12 15.4l5.2 6' }
    ],
    clock: [
      { cx: 12, cy: 12, r: 8.3 },
      { d: 'M12 6.6V12l3.6 2.2' }
    ]
  };
  const sides = { top: { x: 0, y: -1 }, right: { x: 1, y: 0 }, bottom: { x: 0, y: 1 }, left: { x: -1, y: 0 } };

  // 主节点外形：rect（默认，圆角由 r 控制）、pill（胶囊，两端半圆）、diamond（菱形，判断）、ellipse（椭圆，起止）。
  // 只有 rect 使用 r；其余形状的边界按解析几何求，锚点、角标与文字可用区域都以形状边界为准。
  const shapeOf = shape => shape.shape || 'rect';
  const centerOf = shape => ({ x: shape.x + shape.w / 2, y: shape.y + shape.h / 2 });
  // 胶囊的脊线：横放时是水平线段，竖放时是垂直线段；形状 = 脊线 ⊕ 半径 R 的圆
  const spineOf = shape => shape.w >= shape.h
    ? { x1: shape.x + shape.h / 2, y1: shape.y + shape.h / 2, x2: shape.x + shape.w - shape.h / 2, y2: shape.y + shape.h / 2, r: shape.h / 2 }
    : { x1: shape.x + shape.w / 2, y1: shape.y + shape.w / 2, x2: shape.x + shape.w / 2, y2: shape.y + shape.h - shape.w / 2, r: shape.w / 2 };
  // 梯形的凸四边形顶点：上边缘全宽，下边缘两侧各内缩 12%（漏斗层级形状）
  const trapezoidOf = shape => [
    { x: shape.x, y: shape.y }, { x: shape.x + shape.w, y: shape.y },
    { x: shape.x + shape.w * 0.88, y: shape.y + shape.h }, { x: shape.x + shape.w * 0.12, y: shape.y + shape.h }
  ];
  function insideShape(shape, point, inset = 0) {
    const kind = shapeOf(shape);
    const c = centerOf(shape);
    const dx = point.x - c.x;
    const dy = point.y - c.y;
    if (kind === 'pill') {
      const spine = spineOf(shape);
      const u = Math.max(spine.x1, Math.min(point.x, spine.x2));
      const v = Math.max(spine.y1, Math.min(point.y, spine.y2));
      return Math.hypot(point.x - u, point.y - v) < spine.r - inset;
    }
    // 凸四边形逐边判定：点对每条有向边（顺时针）的叉积须同号，inset 换算成到边的垂直距离
    if (kind === 'trapezoid') {
      const vertices = trapezoidOf(shape);
      for (let index = 0; index < 4; index++) {
        const a = vertices[index];
        const b = vertices[(index + 1) % 4];
        const cross = (b.x - a.x) * (point.y - a.y) - (b.y - a.y) * (point.x - a.x);
        const distance = -cross / Math.hypot(b.x - a.x, b.y - a.y);
        if (distance < inset) return false;
      }
      return true;
    }
    const half = { w: shape.w / 2 - inset, h: shape.h / 2 - inset };
    if (half.w <= 0 || half.h <= 0) return false;
    if (kind === 'diamond') return Math.abs(dx) / half.w + Math.abs(dy) / half.h <= 1;
    // initial/final 起止圆点与椭圆同算法（外接框即圆的外接框）
    if (kind !== 'rect') return (dx / half.w) ** 2 + (dy / half.h) ** 2 <= 1;
    return Math.abs(dx) < half.w && Math.abs(dy) < half.h;
  }
  // 把外接矩形上的目标点沿「中心→目标」方向推到形状边界：rect 的目标点本来就在边界上
  function boundary(shape, target) {
    const kind = shapeOf(shape);
    const c = centerOf(shape);
    const dx = target.x - c.x;
    const dy = target.y - c.y;
    if (kind === 'rect' || (!dx && !dy)) return { x: target.x, y: target.y };
    // 梯形：中心→目标射线与四条边求交，取参数 t 最小的正向交点
    if (kind === 'trapezoid') {
      const vertices = trapezoidOf(shape);
      let nearest = Infinity;
      for (let index = 0; index < 4; index++) {
        const a = vertices[index];
        const b = vertices[(index + 1) % 4];
        const ex = b.x - a.x;
        const ey = b.y - a.y;
        const denom = dx * ey - dy * ex;
        if (!denom) continue;
        const t = ((a.x - c.x) * ey - (a.y - c.y) * ex) / denom;
        const u = ((a.x - c.x) * dy - (a.y - c.y) * dx) / denom;
        if (t > 0 && u >= 0 && u <= 1 && t < nearest) nearest = t;
      }
      return nearest === Infinity ? { x: target.x, y: target.y } : { x: c.x + dx * nearest, y: c.y + dy * nearest };
    }
    if (kind === 'pill') {
      let near = 0;
      let far = 2;
      while (insideShape(shape, { x: c.x + dx * far, y: c.y + dy * far }) && far < 64) far *= 2;
      for (let step = 0; step < 24; step++) {
        const middle = (near + far) / 2;
        if (insideShape(shape, { x: c.x + dx * middle, y: c.y + dy * middle })) near = middle;
        else far = middle;
      }
      return { x: c.x + dx * near, y: c.y + dy * near };
    }
    const scale = kind === 'diamond'
      ? 1 / (Math.abs(dx) / (shape.w / 2) + Math.abs(dy) / (shape.h / 2))
      : 1 / Math.hypot(dx / (shape.w / 2), dy / (shape.h / 2));
    return { x: c.x + dx * scale, y: c.y + dy * scale };
  }
  // 角标落在形状内侧的右上方向，离边界约 15：rect 沿用原有的固定角落
  function badgeCenter(shape) {
    const kind = shapeOf(shape);
    const c = centerOf(shape);
    if (kind === 'diamond') return { x: c.x + shape.w * 0.15, y: c.y - shape.h * 0.15 };
    if (kind === 'ellipse') {
      const scale = Math.max(1 - 15 / Math.min(shape.w / 2, shape.h / 2), 0);
      return { x: c.x + shape.w / 2 * 0.707 * scale, y: c.y - shape.h / 2 * 0.707 * scale };
    }
    if (kind === 'pill') {
      const spine = spineOf(shape);
      const offset = Math.max(spine.r - 15, 0) * 0.707;
      const end = shape.w >= shape.h ? { x: spine.x2, y: spine.y1 } : { x: spine.x1, y: spine.y1 };
      return { x: end.x + offset, y: end.y - offset };
    }
    return { x: shape.x + shape.w - 17, y: shape.y + 17 };
  }

  function element(name, attributes = {}, parent) {
    const node = document.createElementNS(svgNS, name);
    for (const [key, value] of Object.entries(attributes)) if (value !== undefined && value !== null) node.setAttribute(key, value);
    if (parent) parent.append(node);
    return node;
  }
  function text(parent, x, y, content, attributes) {
    const node = element('text', { x, y, ...attributes }, parent);
    const lines = String(content).split('\n');
    lines.forEach((line, index) => {

      for (const box of boxes) if (!ends.has(box.id) && points.some(p => insideShape(box.shape, box.frame, p, 2))) errors.push(`穿框：${name} 穿过 ${box.id}`);
      if (length < (arrow.size === 'sm' ? 12 : 28)) errors.push(`短边：${name} 仅 ${Math.round(length)}px`);
      // 斜线：直线几乎横平竖直却差了几度，多半是两端框没对齐
      if (arrow.shape === 'line') {
        const first = points[0];
        const last = points[points.length - 1];
        const angle = Math.abs(Math.atan2(last.y - first.y, last.x - first.x) * 180 / Math.PI) % 90;
        const off = Math.min(angle, 90 - angle);
        if (off > 0.5 && off < 10) errors.push(`斜线：${name} 偏离横平竖直 ${off.toFixed(1)}°，对齐两端坐标`);
      }
      // 箭头折角：箭头头部底下（末端 18px 内）线的方向变化过大，看起来像被掰弯
      if (arrow.size !== 'sm' && length > 30) {
        const path = paths[index];
        const at = d => path.getPointAtLength(Math.max(0, length - d));
        const heading = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
        const turn = Math.abs(((heading(at(2), at(0)) - heading(at(24), at(18))) * 180 / Math.PI + 540) % 360 - 180);
        if (turn > 25) errors.push(`箭头折角：${name} 末端转了 ${Math.round(turn)}°，箭头要落在直的一段上`);
      }
      if (points.some(p => p.x < -1 || p.y < -1 || p.x > width + 1 || p.y > height + 1)) errors.push(`越界：连线 ${name}`);
    });
    // 边标签按箭头顺序渲染：第 k 个标签属于第 k 支带 label 的箭头
    const owners = (slide.arrows || []).map((arrow, index) => (arrow.label ? index : null)).filter(index => index !== null);
    labels.forEach((label, k) => {
      const owner = owners[k];
      const name = owner === undefined ? '' : `${idOf(slide.arrows[owner].from)}→${idOf(slide.arrows[owner].to)}`;
      const halo = { left: label.rect.left - 3, top: label.rect.top - 3, right: label.rect.right + 3, bottom: label.rect.bottom + 3 };
      for (const box of boxes) if (convexOverlap(outline('rect', { left: label.rect.left - 1, top: label.rect.top - 1, right: label.rect.right + 1, bottom: label.rect.bottom + 1 }), outline(box.shape, box.frame))) errors.push(`标签压框：「${label.text}」压 ${box.id}`);
      for (const group of groups) if (group.title && overlaps(label.rect, rectOf(group.title))) errors.push(`标签压标题：「${label.text}」`);
      samples.forEach(({ points }, index) => {
        if (points.some(p => contains(halo, p))) errors.push(`标签压线：「${label.text}」离 ${idOf(slide.arrows[index].from)}→${idOf(slide.arrows[index].to)} 不足 3px`);
      });
      if (owner !== undefined) {
        const { length, points } = samples[owner];
        const gap = Math.min(...points.map(p => Math.hypot(Math.max(label.rect.left - p.x, 0, p.x - label.rect.right), Math.max(label.rect.top - p.y, 0, p.y - label.rect.bottom))));
        if (gap > 30) errors.push(`标签离线太远：「${label.text}」离 ${name} ${Math.round(gap)}px（应 ≤ 30）`);
        if (length < label.rect.right - label.rect.left + 24) errors.push(`标签放不下：「${label.text}」比 ${name} 的线长（${Math.round(length)}px）还宽，拉开两框或缩短标签`);
      }
      if (!inCanvas(label.rect)) errors.push(`越界：标签「${label.text}」`);
    });
    for (let a = 0; a < labels.length; a++) for (let b = a + 1; b < labels.length; b++) {
      if (overlaps(labels[a].rect, labels[b].rect)) errors.push(`标签互压：「${labels[a].text}」/「${labels[b].text}」`);
    }
    for (const group of groups) {
      if (!inCanvas(group.frame)) errors.push(`越界：容器 ${group.id}`);
      if (!group.title) continue;
      const title = rectOf(group.title);
      for (const box of boxes) if (overlaps(title, box.frame)) errors.push(`标题被挡：容器 ${group.id} 的标题压 ${box.id}`);
      if (group.card && overlaps(title, rectOf(group.card))) errors.push(`标题被挡：容器 ${group.id} 的标题压卡片`);
    }
    return { errors, hints };
  }

  // Ignore line wrapping and whitespace only, not punctuation or words.
  const normalize = value => String(value ?? '').replace(/\s+/g, '');
  const statusOf = node => node.status || '';
  const kindOf = edge => edge.kind || 'flow';

  function semantic(diagram, content) {
    const errors = [];
    const hints = [];
    const shapes = new Map();
    for (const shape of [
      ...(diagram.groups || []).map(group => ({ ...group, label: group.title })),
      // 泳道泳池的每一条道是语义节点（label 取道标题）；外框与分隔线不是节点
      ...(diagram.swimlane?.lanes || []).map(lane => ({ ...lane, label: lane.title })),
      ...(diagram.boxes || [])
    ]) {
      if (shapes.has(shape.id)) errors.push(`Duplicate diagram node: ${shape.id}`);
      shapes.set(shape.id, shape);
    }
    const expected = new Map();
    for (const node of content.nodes || []) {
      if (expected.has(node.id)) errors.push(`Duplicate content node: ${node.id}`);
      expected.set(node.id, node);
      const shape = shapes.get(node.id);
      if (!shape || shape.size === 'sm') {
        errors.push(`Missing main node: ${node.id} (${node.label})`);
        continue;
      }
      for (const field of ['label', 'value']) {
        if (normalize(shape[field]) !== normalize(node[field])) {
          errors.push(`Different ${field}: ${node.id}; content “${node[field] ?? ''}”, diagram “${shape[field] ?? ''}”`);
        }
      }
      // fields/methods 数组逐元素比对（去全部空白）；未声明与空数组等价
      for (const list of ['fields', 'methods']) {
        const inDiagram = (shape[list] || []).map(normalize);
        const inContent = (node[list] || []).map(normalize);
        if (inDiagram.length !== inContent.length || inDiagram.some((item, index) => item !== inContent[index])) {
          errors.push(`Different ${list}: ${node.id}; content [${(node[list] || []).join(', ')}], diagram [${(shape[list] || []).join(', ')}]`);
        }
      }
      // rows 数组逐行比对：key/name/type 各字段去全部空白，缺失字段视为 ''；未声明与空数组等价
      const rowsOf = shape => (shape.rows || []).map(row => ({ key: normalize(row.key), name: normalize(row.name), type: normalize(row.type) }));
      const rowsText = rows => rows.map(row => [row.key, row.name, row.type].filter(Boolean).join(' ')).join(', ');
      const diagramRows = rowsOf(shape);
      const contentRows = rowsOf(node);
      if (diagramRows.length !== contentRows.length || diagramRows.some((row, index) => {
        const other = contentRows[index];
        return row.key !== other.key || row.name !== other.name || row.type !== other.type;
      })) {
        errors.push(`Different rows: ${node.id}; content [${rowsText(contentRows)}], diagram [${rowsText(diagramRows)}]`);
      }
      if (statusOf(shape) !== statusOf(node)) {
        errors.push(`Different status: ${node.id}; content ${statusOf(node) || 'none'}, diagram ${statusOf(shape) || 'none'}`);
      }
    }
    for (const shape of shapes.values()) {
      if (shape.size !== 'sm' && !expected.has(shape.id)) errors.push(`Extra main node: ${shape.id}`);
    }
    // Each occurrence consumes one matching arrow, preserving parallel-edge multiplicity.
    // start（compose/aggregate 起点菱形）与 kind 一样是语义属性，两端必须一致
    const startOf = edge => edge.start || '';
    const keyOf = edge => JSON.stringify([idOf(edge.from), idOf(edge.to), normalize(edge.label), kindOf(edge), startOf(edge)]);
    const drawn = new Map();
    for (const arrow of diagram.arrows || []) {
      if (arrow.size === 'sm') continue;
      const key = keyOf(arrow);
      drawn.set(key, (drawn.get(key) || 0) + 1);
    }
    for (const edge of content.edges || []) {
      const key = keyOf(edge);
      const count = drawn.get(key) || 0;
      if (!count) errors.push(`Missing edge: ${edge.from}→${edge.to} [${edge.label ?? ''}; ${kindOf(edge)}]`);
      else drawn.set(key, count - 1);
    }
    for (const [key, count] of drawn) {
      if (!count) continue;
      const [from, to, label, kind] = JSON.parse(key);
      errors.push(`Extra edge: ${from}→${to} [${label}; ${kind}] ×${count}`);
    }
    return { errors, hints };
  }

  window.DiagramCheck = { geometry, semantic };
})();

(order)", "at": [725, 572]}]}}, {"id": "delivery-sequence", "title": "外卖履约时序：脚注框与分区片段", "note": "时序进阶：四位参与者各带一条生命线，并在生命线末端各放一个同款脚注框（foot），上下对称；Par 片段分两区（[通知厨房] / [回复客户]），Loop 片段守卫 [直到送达]，片段框统一虚线；订单服务生命线旁的 amber 小框是「校验商品并扣款」的内部动作示意，不进 content。来源：demo/brief.md。", "content": {"nodes": [{"id": "client", "label": "客户端 App"}, {"id": "order-svc", "label": "订单服务"}, {"id": "kitchen", "label": "厨房"}, {"id": "rider", "label": "骑手"}], "edges": [{"from": "client", "to": "order-svc", "label": "提交订单"}, {"from": "order-svc", "to": "kitchen", "label": "新订单票据"}, {"from": "order-svc", "to": "client", "label": "已接单，预计 30 分钟", "kind": "reply"}, {"from": "kitchen", "to": "order-svc", "label": "订单就绪", "kind": "reply"}, {"from": "order-svc", "to": "rider", "label": "请求取餐"}, {"from": "rider", "to": "client", "label": "分享实时位置", "kind": "reply"}, {"from": "rider", "to": "client", "label": "订单送达", "kind": "reply"}]}, "diagram": {"w": 960, "h": 800, "boxes": [{"id": "client", "x": 65, "y": 30, "w": 170, "h": 80, "fill": "sky", "label": "客户端 App"}, {"id": "order-svc", "x": 285, "y": 30, "w": 170, "h": 80, "fill": "mint", "label": "订单服务"}, {"id": "kitchen", "x": 505, "y": 30, "w": 170, "h": 80, "fill": "pink", "label": "厨房"}, {"id": "rider", "x": 725, "y": 30, "w": 170, "h": 80, "fill": "violet", "label": "骑手", "icon": "actor"}, {"id": "verify-pay", "x": 380, "y": 425, "w": 110, "h": 30, "fill": "amber", "label": "校验商品并扣款", "size": "sm"}], "lifelines": [{"of": "client", "foot": 690}, {"of": "order-svc", "foot": 690}, {"of": "kitchen", "foot": 690}, {"of": "rider", "foot": 690}], "fragments": [{"kind": "par", "x": 130, "y": 150, "w": 480, "h": 210, "dashed": true, "sections": [{"guard": "[通知厨房]"}, {"guard": "[回复客户]"}]}, {"kind": "loop", "x": 130, "y": 500, "w": 700, "h": 120, "dashed": true, "guard": "[直到送达]"}], "arrows": [{"from": "client@life:140", "to": "order-svc@life:140", "label": "提交订单", "at": [260, 124]}, {"from": "order-svc@life:246", "to": "kitchen@life:246", "label": "新订单票据", "at": [480 uler@right", "to": "queue@left", "shape": "line", "label": "定时投递", "at": [268, 354]}, {"from": "queue@top", "to": "worker@bottom", "shape": "arc", "kind": "async", "label": "消费", "at": [446, 300]}, {"from": "worker@right:0.3", "to": "store@left", "shape": "arc", "label": "读写", "at": [552, 96]}, {"from": "worker@right:0.7", "to": "monitor@left", "shape": "arc", "label": "上报", "at": [552, 354]}]}}, {"id": "order-states", "title": "订单状态机：起止圆点", "note": "状态机：initial 实心圆点开局、final 牛眼收官，迁移条件标在边上，终态用 muted 表示关闭。来源：demo/brief.md。", "content": {"nodes": [{"id": "begin", "label": ""}, {"id": "pending", "label": "待支付"}, {"id": "paid", "label": "已支付", "status": "ok"}, {"id": "cancelled", "label": "已取消", "status": "muted"}, {"id": "done", "label": ""}], "edges": [{"from": "begin", "to": "pending"}, {"from": "pending", "to": "paid", "label": "支付成功"}, {"from": "pending", "to": "cancelled", "label": "超时关闭"}, {"from": "paid", "to": "done", "label": "订单完成"}]}, "diagram": {"boxes": [{"id": "begin", "shape": "initial", "x": 48, "y": 213, "w": 24, "h": 24}, {"id": "pending", "x": 130, "y": 190, "w": 150, "h": 70, "fill": "amber", "label": "待支付"}, {"id": "paid", "x": 390, "y": 100, "w": 150, "h": 70, "fill": "mint", "label": "已支付", "status": "ok"}, {"id": "cancelled", "x": 390, "y": 300, "w": 150, "h": 70, "fill": "pink", "label": "已取消", "status": "muted"}, {"id": "done", "shape": "final", "x": 638, "y": 123, "w": 24, "h": 24}], "arrows": [{"from": "begin@right", "to": "pending@left", "shape": "line"}, {"from": "pending@top", "to": "paid@left", "shape": "arc", "label": "支付成功", "at": [270, 112]}, {"from": "pending@bottom", "to": "cancelled@left", "shape": "arc", "label": "超时关闭", "at": [270, 358]}, {"from": "paid@right", "to": "done@left", "shape": "line", "label": "订单完成", "at": [589, 116]}]}}, {"id": "order-data-model", "title": "订单数据模型：标准 ER", "note": "标准 ER：实体用 rows 三列（键标记/列名/类型），1:N 关系起点短杠（start one）贴「一」侧、终点鸦脚（kind many）贴「多」侧，直线横排相连。来源：demo/brief.md。", "content": {"nodes": [{"id": "customer", "label": "客户", "rows": [{"key": "PK", "name": "customer_id", "type": "bigint"}, {"name": "name", "type": "citext"}, {"name": "phone", "type": "citext"}]}, {"id": "order", "label": "订单", "rows": [{"key": "PK", "name": "order_id", "type": "bigint"}, {"key": "FK", "name": "customer_id", "type": "bigint"}, {"name": "total_amount", "type": "numeric"}, {"name": "status", "type": "citext"}]}, {"id": "item", "label": "订单明细", "rows": [{"key": "PK", "name": "item_id", "type": "bigint"}, {"key": "FK", "name": "order_id", "type": "bigint"}, {"name": "quantity", "type": "integer"}, {"name": "unit_price", "type": "numeric"}]}], "edges": [{"from": "customer", "to": "order", "label": "1:N", "kind": "many", "start": "one"}, {"from": "order", "to": "item", "label": "1:N", "kind": "many", "start": "one"}]}, "diagram": {"boxes": [{"id": "customer", "x": 20, "y": 160, "w": 200, "h": 130, "fill": "sky", "label": "客户", "rows": [{"key": "PK", "name": "customer_id", "type": "bigint"}, {"name": "name", "type": "citext"}, {"name": "phone", "type": "citext"}]}, {"id": "order", "x": 290, "y": 150, "w": 240, "h": 150, "fill": "mint", "label": "订单", "rows": [{"key": "PK", "name": "order_id", "type": "bigint"}, {"key": "FK", "name": "customer_id", "type": "bigint"}, {"name": "total_amount", "type": "numeric"}, {"name": "status", "type": "citext"}]}, {"id": "item", "x": 600, "y": 150, "w": 200, "h": 150, "fill": "mintSoft", "label": "订单明细", "rows": [{"key": "PK", "name": "item_id", "type": "bigint"}, {"key": "FK", "name": "order_id", "type": "bigint"}, {"name": "quantity", "type": "integer"}, {"name": "unit_price", "type": "numeric"}]}], "arrows": [{"from": "customer@right", "to": "order@left", "shape": "line", "kind": "many", "start": "one", "label": "1:N", "at": [255, 211]}, {"from": "order@right", "to": "item@left", "shape": "line", "kind": "many", "start": "one", "label": "1:N", "at": [565, 211]}], "w": 820}}, {"id": "approval-swimlane", "title": "审批泳道", "note": "泳道泳池：单一外框 + 顶部标题带 + 道间分隔 const diagramStyle = "/* Diagram styles: white canvas, bright fills, bold labels, solid directional arrows. */\n.slide { display: block; width: 100%; height: auto; background: #fff; font-family: \"PingFang SC\", -apple-system, BlinkMacSystemFont, \"Helvetica Neue\", \"Microsoft YaHei\", sans-serif; }\n.slide text { dominant-baseline: central; text-anchor: middle; }\n.slide-box-label { font-size: 20px; font-weight: 700; fill: #111; }\n.slide-box--sm .slide-box-label { font-size: 9.5px; }\n.slide-box-value { font-size: 13px; font-weight: 500; fill: #1d2125; }\n/* 生命线脚注框（lifelines[].foot）：参与者盒子的视觉副本，装饰而非节点。类名全部独立于\n   .slide-box/.slide-group/.slide-shape/.slide-arrow 两族，检查器选择器看不到它，因此不会触发\n   文字溢出/框重叠/穿框等几何判定；填充与描边照搬主盒（在 diagram.js 里作为属性给出）。\n   块内顺序即优先级：ER 单元格同时带 .slide-foot-member 与 .slide-foot-key/.slide-foot-type，\n   三者都是「元素 + 类」，靠「来源顺序在后」让 key 加粗、type 右对齐（与主盒 ER 列同款）。 */\n.slide-foot-label { font-size: 20px; font-weight: 700; fill: #111; }\n.slide-foot--sm .slide-foot-label { font-size: 9.5px; }\n.slide-foot-value { font-size: 13px; font-weight: 500; fill: #1d2125; }\n.slide text.slide-foot-member { font-size: 13px; font-weight: 500; fill: #1d2125; text-anchor: start; }\n.slide text.slide-foot-key { font-weight: 600; }\n.slide text.slide-foot-type { fill: #5d6670; text-anchor: end; }\n.slide-foot-divider { stroke: #111; stroke-width: 1.2; opacity: .25; }\n.slide-foot-label.is-muted, .slide-foot-value.is-muted { fill: #5d6670; }\n/* 类图分栏：成员行左对齐小字，分隔线为压暗细线 */\n.slide text.slide-box-member { font-size: 13px; font-weight: 500; fill: #1d2125; text-anchor: start; }\n/* ER 行三列：key 列加粗，type 列压暗并右对齐（与 member 同优先级、靠后出现以覆盖 text-anchor） */\n.slide text.slide-box-key { font-weight: 600; }\n.slide text.slide-box-type { fill: #5d6670; text-anchor: end; }\n.slide-box-divider { stroke: #111; stroke-width: 1.2; opacity: .25; }\n.slide-box-label.is-muted, .slide-box-value.is-muted { fill: #5d6670; }\n/* 节点图标：与文字同墨色的线条图标，位于框顶，不占语义 */\n.slide-icon { fill: none; stroke: #111; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }\n.slide-badge { font-size: 13px; font-weight: 800; }\n.slide-group-title { font-size: 16px; font-weight: 700; fill: #111; }\n/* 左对齐标题（group.titleAlign: 'left'）：用「元素 + 类」同优先级选择器压过 `.slide text` 的 text-anchor: middle */\n.slide text.slide-group-title.is-left { text-anchor: start; }\n.slide-arrow { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }\n.slide-arrow--sm { stroke-width: 1.6; }\n.slide-arrow--blocked { stroke: #e0245e; stroke-dasharray: 9 7; }\n/* 返回/响应（reply）用虚线：UML 交互图里同步调用是实线、返回是虚线；箭头形状（实心/开放）由 diagram.js 的 heads 决定。 */\n.slide-arrow--reply { stroke-dasharray: 9 7; }\n.slide-arrow-label { font-size: 14px; font-weight: 600; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }\n.slide-arrow-label--blocked { fill: #c41d4f; }\n.slide-note { font-size: 13px; font-weight: 500; fill: #5d6670; }\n.slide-note--warn { fill: #c41d4f; font-weight: 700; }\n/* 泳道泳池：标题带与道间分隔线，弱化描边不抢流程 */\n.slide-swimlane-title { font-size: 16px; font-weight: 700; fill: #111; }\n.slide-swimlane-sep { fill: none; stroke: #1b1b1b; stroke-width: 1.2; opacity: .45; }\n/* 生命线（时序风格）与结束短杠：压暗虚线，只做时间轴示意，不表示关系强度。 */\n.slide-lifeline { fill: none; stroke: #111; stroke-width: 1.5; stroke-dasharray: 7 7; opacity: .35; }\n.slide-lifeline-end { fill: none; stroke: #111; stroke-width: 1.5; opacity: .35; }\n/* 激活条：生命线上的执行窄条，14 宽、以时间轴为中心；压暗填充让它读作「正在执行」而不是新节点。\n   类名避开 .slide-shape/.slide-box/.slide-group/.slide-arrow，几何检查完全不看它。 */\n.slide-activation { fill: #dde3e8; stroke: #111; stroke-width: 1.2; }\n/* 交互片段框（Alt/Opt/Loop/Par）：白色半透明面板 + 左上角标签条 + 可选守卫/操作符文字。\n   面板是片段底衬，排在生命线之前（见 diagram.js），消息线、生命线与激活条因此都画在它之上、\n   一个像素都不会被它的白底洗淡；面板自身 92% 不透明度的描边仍足以让四条边框（含底边）清晰可辨。 */\n.slide-fragment { fill: #fff; opacity: .92; stroke: #111; stroke-width: 1.5; }\n/* fragments[].dashed: 虚线外框（次要/试探性的组合片段），仅换描边线型，不透明度与宽度不变 */\n.slide-fragment.is-dashed { stroke-dasharray: 9 7; }\n.slide-fragment-tab { fill: #eceff2; stroke: #111; stroke-width: 1.5; }\n/* fragments[].sections 的分区虚线：标签条以下每段的段间分隔线，横向从外框内缘到内缘（x+1 → x+w−1） */\n.slide-fragment-divider { fill: none; stroke: #111; stroke-width: 1.2; opacity: .5; stroke-dasharray: 6 5; }\n/* 左对齐/右对齐文本：`.slide text` 的 text-anchor: middle 同优先级，必须用「元素 + 类」才覆盖得住 */\n.slide text.slide-fragment-tab-text { font-size: 14px; font-weight: 700; fill: #111; text-anchor: start; }\n.slide text.slide-fragment-guard { font-size: 14px; fill: #111; text-anchor: start; }\n.slide text.slide-fragment-op { font-size: 14px; fill: #111; text-anchor: end; }\n";

(async () => {
  const report = { frames: documentData.frames.length, drawn: 0, errors: 0, hints: 0, items: [], scriptErrors: [] };
  const root = document.getElementById('preview');
  for (const frame of documentData.frames) {
    const article = document.createElement('article');
    article.className = 'preview-frame'; article.dataset.key = frame.id;
    const heading = document.createElement('h2'); heading.textContent = frame.title;
    const note = document.createElement('p'); note.textContent = frame.note || '';
    const canvas = document.createElement('div'); canvas.className = 'preview-slide';
    const result = document.createElement('ul'); result.className = 'preview-check';
    article.append(heading, note, canvas, result); root.append(article);
    try {
      const svg = Diagram.render(frame.diagram, { title: frame.title });
      canvas.append(svg); report.drawn++;
    } catch (error) {
      report.scriptErrors.push(frame.id + ': ' + error.message);
    }
  }
  await document.fonts.ready;
  for (const frame of documentData.frames) {
    const article = [...root.children].find(element => element.dataset.key === frame.id);
    const svg = article.querySelector('svg.slide');
    const result = article.querySelector('.preview-check');
    let errors = [], hints = [];
    if (!svg) errors.push('Missing rendered diagram: ' + frame.id);
    else {
      const geometry = DiagramCheck.geometry(svg, frame.diagram);
      const semantic = DiagramCheck.semantic(frame.diagram, frame.content);
      errors = [...geometry.errors, ...semantic.errors]; hints = [...geometry.hints, ...semantic.hints];
    }
    report.errors += errors.length; report.hints += hints.length;
    report.items.push({ key: frame.id, drawn: Boolean(svg), errors, hints });
    for (const [level, lines] of [['error', errors], ['hint', hints]]) for (const message of lines) {
      const li = document.createElement('li'); li.dataset.level = level; li.textContent = message; result.append(li);
    }
    if (!errors.length) {
      const li = document.createElement('li'); li.dataset.level = 'ok';
      li.textContent = 'Geometry and content checks passed; visual review still required.'; result.append(li);
    }
  }
  report.scriptErrors.push(...window.__diagramErrors);
  const summary = document.getElementById('preview-summary');
  summary.textContent = `${report.drawn}/${report.frames} diagrams · ${report.errors} errors · ${report.hints} hints`;
  summary.dataset.level = report.errors || report.scriptErrors.length ? 'error' : 'ok';
  window.__diagramStyle = diagramStyle;
  window.__diagramCheck = report;
  document.body.dataset.ready = 'true';
})().catch(error => {
  window.__diagramCheck = { frames: documentData.frames.length, drawn: 0, errors: 1, hints: 0, items: [], scriptErrors: [error.message] };
  document.getElementById('preview-summary').textContent = error.message;
  document.body.dataset.ready = 'true';
});
