<svg viewBox="0 0 820 450" xmlns="http://www.w3.org/2000/svg" class="slide" role="img"><style>/* Diagram styles: white canvas, bright fills, bold labels, solid directional arrows. */
.slide { display: block; width: 100%; height: auto; background: #fff; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.slide text { dominant-baseline: central; text-anchor: middle; }
.slide-box-label { font-size: 20px; font-weight: 700; fill: #111; }
.slide-box--sm .slide-box-label { font-size: 9.5px; }
.slide-box-value { font-size: 13px; font-weight: 500; fill: #1d2125; }
/* 类图分栏：成员行左对齐小字，分隔线为压暗细线 */
.slide text.slide-box-member { font-size: 13px; font-weight: 500; fill: #1d2125; text-anchor: start; }
/* ER 行三列：key 列加粗，type 列压暗并右对齐（与 member 同优先级、靠后出现以覆盖 text-anchor） */
.slide text.slide-box-key { font-weight: 600; }
.slide text.slide-box-type { fill: #5d6670; text-anchor: end; }
.slide-box-divider { stroke: #111; stroke-width: 1.2; opacity: .25; }
.slide-box-label.is-muted, .slide-box-value.is-muted { fill: #5d6670; }
/* 节点图标：与文字同墨色的线条图标，位于框顶，不占语义 */
.slide-icon { fill: none; stroke: #111; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.slide-badge { font-size: 13px; font-weight: 800; }
.slide-group-title { font-size: 16px; font-weight: 700; fill: #111; }
/* 左对齐标题（group.titleAlign: 'left'）：用「元素 + 类」同优先级选择器压过 `.slide text` 的 text-anchor: middle */
.slide text.slide-group-title.is-left { text-anchor: start; }
.slide-arrow { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }
.slide-arrow--sm { stroke-width: 1.6; }
.slide-arrow--blocked { stroke: #e0245e; stroke-dasharray: 9 7; }
/* 返回/响应（reply）用虚线：UML 交互图里同步调用是实线、返回是虚线；箭头形状（实心/开放）由 diagram.js 的 heads 决定。 */
.slide-arrow--reply { stroke-dasharray: 9 7; }
.slide-arrow-label { font-size: 14px; font-weight: 600; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.slide-arrow-label--blocked { fill: #c41d4f; }
.slide-note { font-size: 13px; font-weight: 500; fill: #5d6670; }
.slide-note--warn { fill: #c41d4f; font-weight: 700; }
/* 泳道泳池：标题带与道间分隔线，弱化描边不抢流程 */
.slide-swimlane-title { font-size: 16px; font-weight: 700; fill: #111; }
.slide-swimlane-sep { fill: none; stroke: #1b1b1b; stroke-width: 1.2; opacity: .45; }
/* 生命线（时序风格）与结束短杠：压暗虚线，只做时间轴示意，不表示关系强度。 */
.slide-lifeline { fill: none; stroke: #111; stroke-width: 1.5; stroke-dasharray: 7 7; opacity: .35; }
.slide-lifeline-end { fill: none; stroke: #111; stroke-width: 1.5; opacity: .35; }
/* 激活条：生命线上的执行窄条，14 宽、以时间轴为中心；压暗填充让它读作「正在执行」而不是新节点。
   类名避开 .slide-shape/.slide-box/.slide-group/.slide-arrow，几何检查完全不看它。 */
.slide-activation { fill: #dde3e8; stroke: #111; stroke-width: 1.2; }
/* 交互片段框（Alt/Opt/Loop/Par）：白色半透明面板 + 左上角标签条 + 可选守卫/操作符文字。
   面板是片段底衬，排在生命线之前（见 diagram.js），消息线、生命线与激活条因此都画在它之上、
   一个像素都不会被它的白底洗淡；面板自身 92% 不透明度的描边仍足以让四条边框（含底边）清晰可辨。 */
.slide-fragment { fill: #fff; opacity: .92; stroke: #111; stroke-width: 1.5; }
.slide-fragment-tab { fill: #eceff2; stroke: #111; stroke-width: 1.5; }
/* 左对齐/右对齐文本：`.slide text` 的 text-anchor: middle 同优先级，必须用「元素 + 类」才覆盖得住 */
.slide text.slide-fragment-tab-text { font-size: 14px; font-weight: 700; fill: #111; text-anchor: start; }
.slide text.slide-fragment-guard { font-size: 14px; fill: #111; text-anchor: start; }
.slide text.slide-fragment-op { font-size: 14px; fill: #111; text-anchor: end; }
</style><title>订单类图</title><defs><marker id="diagram-11-head-flow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-11-head-flow-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-11-head-async" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 11.5 6 L 0.5 11" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="diagram-11-head-async-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 11.5 6 L 0.5 11" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="diagram-11-head-reply" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 11.5 6 L 0.5 11" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="diagram-11-head-reply-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 11.5 6 L 0.5 11" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></marker><marker id="diagram-11-head-blocked" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><marker id="diagram-11-head-blocked-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><marker id="diagram-11-head-many" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 8 6 L 12 1.8 M 8 6 L 12 6 M 8 6 L 12 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="diagram-11-head-many-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 8 6 L 12 1.8 M 8 6 L 12 6 M 8 6 L 12 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="diagram-11-head-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11 0.8 L 11 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-11-head-one-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11 0.8 L 11 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-11-start-compose" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#111" stroke="none" stroke-width="1.4"/></marker><marker id="diagram-11-start-compose-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#111" stroke="none" stroke-width="1.4"/></marker><marker id="diagram-11-start-aggregate" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></marker><marker id="diagram-11-start-aggregate-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></marker><marker id="diagram-11-start-one" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 0.8 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-11-start-one-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 0.8 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-11-start-many" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="diagram-11-start-many-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><filter id="diagram-11-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-lifelines"/><g class="slide-arrows"><path d="M 240 231 L 324 231" class="slide-arrow slide-arrow--many" marker-end="url(#diagram-11-head-many)"/><path d="M 510 231 L 604 231" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-11-head-flow)" marker-start="url(#diagram-11-start-compose)"/></g><g class="slide-boxes"><g class="slide-box" data-id="customer" data-shape="rect"><rect x="60" y="185" width="180" height="92" rx="20" class="slide-shape" fill="#3fb8ff" stroke="none" stroke-width="3"/><text x="150" y="209" class="slide-box-label"><tspan x="150" dy="0em">Customer</tspan></text><path class="slide-box-divider" d="M 70 223 L 230 223"/><text x="72" y="243" class="slide-box-member"><tspan x="72" dy="0em">id</tspan></text><text x="72" y="263" class="slide-box-member"><tspan x="72" dy="0em">name</tspan></text></g><g class="slide-box" data-id="order" data-shape="rect"><rect x="330" y="155" width="180" height="152" rx="20" class="slide-shape" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="420" y="179" class="slide-box-label"><tspan x="420" dy="0em">Order</tspan></text><path class="slide-box-divider" d="M 340 193 L 500 193"/><text x="342" y="213" class="slide-box-member"><tspan x="342" dy="0em">id</tspan></text><text x="342" y="233" class="slide-box-member"><tspan x="342" dy="0em">总额</tspan></text><text x="342" y="253" class="slide-box-member"><tspan x="342" dy="0em">状态</tspan></text><path class="slide-box-divider" d="M 340 263 L 500 263"/><text x="342" y="273" class="slide-box-member"><tspan x="342" dy="0em">提交</tspan></text><text x="342" y="293" class="slide-box-member"><tspan x="342" dy="0em">取消</tspan></text></g><g class="slide-box" data-id="order-item" data-shape="rect"><rect x="610" y="185" width="170" height="92" rx="20" class="slide-shape" fill="#ffb020" stroke="none" stroke-width="3"/><text x="695" y="209" class="slide-box-label"><tspan x="695" dy="0em">OrderItem</tspan></text><path class="slide-box-divider" d="M 620 223 L 770 223"/><text x="622" y="243" class="slide-box-member"><tspan x="622" dy="0em">数量</tspan></text><text x="622" y="263" class="slide-box-member"><tspan x="622" dy="0em">单价</tspan></text></g></g><g class="slide-arrow-labels"><text x="285" y="207" class="slide-arrow-label slide-arrow-label--many"><tspan x="285" dy="0em">1:N</tspan></text><text x="560" y="207" class="slide-arrow-label slide-arrow-label--flow"><tspan x="560" dy="0em">包含</tspan></text></g></svg>