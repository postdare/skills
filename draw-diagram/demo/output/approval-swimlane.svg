 class="slide-group-title"><tspan x="410" dy="0em">提交人</tspan></text></g><g class="slide-group" data-id="lane-reviewer"><rect x="14" y="160" width="792" height="130" rx="22" class="slide-shape" fill="#fff" stroke="#1b1b1b" stroke-width="1.5"/><text x="410" y="182" class="slide-group-title"><tspan x="410" dy="0em">审核人</tspan></text></g><g class="slide-group" data-id="lane-finance"><rect x="14" y="306" width="792" height="130" rx="22" class="slide-shape" fill="#fff" stroke="#1b1b1b" stroke-width="1.5"/><text x="410" y="328" class="slide-group-title"><tspan x="410" dy="0em">财务</tspan></text></g><g class="slide-lifelines"/><g class="slide-arrows"><path d="M 185 112 L 215 179" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-9-head-flow)"/><path d="M 215 285 L 215 362" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-9-head-flow)"/><path d="M 320 235 L 617 235 Q 635 235 635 217 L 635 118" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-9-head-flow)"/></g><g class="slide-boxes"><g class="slide-box" data-id="submit" data-shape="rect"><rect x="110" y="50" width="150" height="62" rx="20" class="slide-shape" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="185" y="81" class="slide-box-label"><tspan x="185" dy="0em">提交申请</tspan></text></g><g class="slide-box" data-id="rework" data-shape="rect"><rect x="560" y="50" width="150" height="62" rx="20" class="slide-shape" fill="#ffb020" stroke="none" stroke-width="3"/><text x="635" y="81" class="slide-box-label"><tspan x="635" dy="0em">退回修改</tspan></text></g><g class="slide-box" data-id="review" data-shape="diamond"><path d="M 215 185 L 320 235 L 215 285 L 110 235 Z" stroke-linejoin="round" class="slide-shape" fill="#a98bff" stroke="none" stroke-width="3"/><text x="215" y="235" class="slide-box-label"><tspan x="215" dy="0em">审核通过？</tspan></text></g><g class="slide-box" data-id="pay" data-shape="rect"><rect x="140" y="368" width="150" height="62" rx="20" class="slide-shape" fill="#ff3d