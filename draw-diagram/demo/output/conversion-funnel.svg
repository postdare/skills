 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><marker id="diagram-11-head-many" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 8 6 L 12 1.8 M 8 6 L 12 6 M 8 6 L 12 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="diagram-11-head-many-sm" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 8 6 L 12 1.8 M 8 6 L 12 6 M 8 6 L 12 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="diagram-11-start-compose" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#111" stroke="none" stroke-width="1.4"/></marker><marker id="diagram-11-start-compose-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#111" stroke="none" stroke-width="1.4"/></marker><marker id="diagram-11-start-aggregate" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></marker><marker id="diagram-11-start-aggregate-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></marker><filter id="diagram-11-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-lifelines"/><g class="slide-arrows"><path d="M 360 68 L 360 130" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-11-head-flow)"/><path d="M 360 192 L 360 254" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-11-head-flow)"/><path d="M 360 316 L 360 378" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-11-head-flow)"/></g><g class="slide-boxes"><g class="slide-box" data-id="expose" data-shape="trapezoid"><path d="M 160 12 L 560 12 L 512 68 L 208 68 Z" stroke-linejoin="round" class="slide-shape" fill="#a98bff" stroke="none" stroke-width="3"/><text x="360" y="30" class="slide-box-label"><tspan x="360" dy="0em">曝光</tspan></text><text x="360" y="55" class="slide-box-value"><tspan x="360" dy="0em">12000</tspan></text></g><g class="slide-box" data-id="click" data-shape="trapezoid"><path d="M 208 136 L 512 136 L 475.52 192 L 244.48 192 Z" stroke-linejoin="round" class="slide-shape" fill="#3fb8ff" stroke="none" stroke-width="3"/><text x="360" y="154" class="slide-box-label"><tspan x="360" dy="0em">点击</tspan></text><text x="360" y="179" class="slide-box-value"><tspan x="360" dy="0em">3600</tspan></text></g><g class="slide-box" data-id="signup" data-shape="trapezoid"><path d="M 244 260 L 476 260 L 448.15999999999997 316 L 271.84 316 Z" stroke-linejoin="round" class="slide-shape" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="360" y="278" class="slide-box-label"><tspan x="360" dy="0em">注册</tspan></text><text x="360" y="303" class="slide-box-value"><tspan x="360" dy="0em">900</tspan></text></g><g class="slide-box" data-id="pay" data-shape="trapezoid"><path d="M 272 384 L 448 384 L 426.88 440 L 293.12 440 Z" stroke-linejoin="round" class="slide-shape" fill="#ffb020" stroke="none" stroke-width="3"/><text x="360" y="402" class="slide-box-label"><tspan x="360" dy="0em">付费</tspan></text><text x="360" y="427" class="slide-box-value"><tspan x="360" dy="0em">180</tspan></text></g></g><g class="slide-arrow-labels"><text x="398" y="102" class="slide-arrow-label slide-arrow-label--flow"><tspan x="398" dy="0em">30%</tspan></text><text x="398" y="226" class="slide-arrow-label slide-arrow-label--flow"><tspan x="398" dy="0em">25%</tspan></text><text x="398" y="350" class="slide-arrow-label slide-arrow-label--flow"><tspan x="398" dy="0em">20%</tspan></text></g></svg>