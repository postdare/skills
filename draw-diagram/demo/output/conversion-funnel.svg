ts="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></marker><marker id="diagram-11-start-one" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 0.8 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-11-start-one-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 0.8 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-11-start-many" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="diagram-11-start-many-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><filter id="diagram-11-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-lifelines"/><g class="slide-arrows"/><g class="slide-boxes"><g class="slide-box" data-id="expose" data-shape="trapezoid"><path d="M 160 12 L 560 12 L 512 76 L 208 76 Z" stroke-linejoin="round" class="slide-shape" fill="#a98bff" stroke="none" stroke-width="3"/><text x="360" y="34" class="slide-box-label"><tspan x="360" dy="0em">曝光</tspan></text><text x="360" y="59" class="slide-box-value"><tspan x="360" dy="0em">12000</tspan></text></g><g class="slide-box" data-id="click" data-shape="trapezoid"><path d="M 208 120 L 512 120 L 475.52 184 L 244.48 184 Z" stroke-linejoin="round" class="slide-shape" fill="#3fb8ff