nUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></marker><marker id="diagram-2-start-one" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 0.8 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-2-start-one-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 0.8 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-2-start-many" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="diagram-2-start-many-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><filter id="diagram-2-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-lifelines"/><g class="slide-arrows"><path d="M 440 59 C 529.6 59 600 106.96 600 168 L 600 184" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-2-head-flow)"/><path d="M 600 260 C 600 333.36 539.28 391 462 391 L 446 391" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-2-head-flow)"/><path d="M 280 391 C 190.39999999999998 391 120 343.04 120 282 L 120 266" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-2-head-flow)"/><path d="M 120 190 C 120 116.63999999999999 180.72 59 258 59 L 274 59" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-2-head-flow)"/></g><g class="slide