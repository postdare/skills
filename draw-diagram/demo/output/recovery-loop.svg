<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" class="slide" role="img"><style>/* Diagram styles: white canvas, bright fills, bold labels, solid directional arrows. */
.slide { display: block; width: 100%; height: auto; background: #fff; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.slide text { dominant-baseline: central; text-anchor: middle; }
.slide-box-label { font-size: 20px; font-weight: 700; fill: #111; }
.slide-box--sm .slide-box-label { font-size: 9.5px; }
.slide-box-value { font-size: 13px; font-weight: 500; fill: #1d2125; }
.slide-box-label.is-muted, .slide-box-value.is-muted { fill: #5d6670; }
.slide-badge { font-size: 13px; font-weight: 800; }
.slide-group-title { font-size: 16px; font-weight: 700; fill: #111; }
.slide-arrow { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }
.slide-arrow--sm { stroke-width: 1.6; }
.slide-arrow--blocked { stroke: #e0245e; stroke-dasharray: 9 7; }
.slide-arrow-label { font-size: 14px; font-weight: 600; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.slide-arrow-label--blocked { fill: #c41d4f; }
.slide-note { font-size: 13px; font-weight: 500; fill: #5d6670; }
.slide-note--warn { fill: #c41d4f; font-weight: 700; }
</style><title>异常恢复闭环</title><defs><marker id="diagram-2-head-flow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-2-head-flow-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-2-head-blocked" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><marker id="diagram-2-head-blocked-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><filter id="diagram-2-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-arrows"><path d="M 440 59 C 529.6 59 600 108.28 600 171 L 600 187" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-2-head-flow)"/><path d="M 600 260 C 600 333.36 537.96 391 459 391 L 443 391" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-2-head-flow)"/><path d="M 280 391 C 190.39999999999998 391 120 341.72 120 279 L 120 263" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-2-head-flow)"/><path d="M 120 190 C 120 116.63999999999999 182.04 59 261 59 L 277 59" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-2-head-flow)"/></g><g class="slide-boxes"><g class="slide-box" data-id="detect"><rect x="280" y="24" width="160" height="70" rx="20" fill="#3fb8ff" stroke="none" stroke-width="3"/><text x="360" y="59" class="slide-box-label"><tspan x="360" dy="0em">监测信号</tspan></text><circle cx="423" cy="41" r="11" fill="#f5a524" stroke="#fff" stroke-width="2"/><text x="423" y="40.7" class="slide-badge" fill="#1a1a1a"><tspan x="423" dy="0em">?</tspan></text></g><g class="slide-box" data-id="locate"><rect x="520" y="190" width="160" height="70" rx="20" fill="#ffb020" stroke="#e5484d" stroke-width="3"/><text x="600" y="225" class="slide-box-label"><tspan x="600" dy="0em">定位原因</tspan></text><circle cx="663" cy="207" r="11" fill="#e5484d" stroke="#fff" stroke-width="2"/><text x="663" y="205.4" class="slide-badge" fill="#fff"><tspan x="663" dy="0em">×</tspan></text></g><g class="slide-box" data-id="repair"><rect x="280" y="356" width="160" height="70" rx="20" fill="#ff3d9e" stroke="none" stroke-width="3"/><text x="360" y="391" class="slide-box-label"><tspan x="360" dy="0em">执行修复</tspan></text><circle cx="423" cy="373" r="11" fill="#18a058" stroke="#fff" stroke-width="2"/><text x="423" y="372.5" class="slide-badge" fill="#fff"><tspan x="423" dy="0em">✓</tspan></text></g><g class="slide-box" data-id="verify"><rect x="40" y="190" width="160" height="70" rx="20" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="120" y="225" class="slide-box-label"><tspan x="120" dy="0em">复核结果</tspan></text><circle cx="183" cy="207" r="11" fill="#18a058" stroke="#fff" stroke-width="2"/><text x="183" y="206.5" class="slide-badge" fill="#fff"><tspan x="183" dy="0em">✓</tspan></text></g></g><g class="slide-arrow-labels"><text x="604" y="100" class="slide-arrow-label slide-arrow-label--flow"><tspan x="604" dy="0em">告警</tspan></text><text x="96" y="104" class="slide-arrow-label slide-arrow-label--flow"><tspan x="96" dy="0em">持续监测</tspan></text></g></svg>