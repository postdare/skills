rkerUnits="userSpaceOnUse"><path d="M 6 0.9 L 11.1 6 L 6 11.1 L 0.9 6 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></marker><marker id="diagram-14-start-one" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 0.8 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-14-start-one-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.8 0.8 L 0.8 11.2" fill="none" stroke="#111" stroke-width="2.4"/></marker><marker id="diagram-14-start-many" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="diagram-14-start-many-sm" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 11.2 6 L 0.8 1.8 M 11.2 6 L 0.8 6 M 11.2 6 L 0.8 10.2" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></marker><filter id="diagram-14-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-lifelines"/><g class="slide-swimlane"><rect x="14" y="14" width="952" height="532" rx="8" fill="#fff" stroke="#1b1b1b" stroke-width="1.5"/><path d="M 14 62 L 966 62" class="slide-swimlane-sep"/><text x="109.2" y="40" class="slide-swimlane-title"><tspan x="109.2" dy="0em">客户</tspan></text><text x="299.6" y="40" class="slide-swimlane-title"><tspan x="299.6" dy="0em">订单服务</tspan></text><path d="M 204.4 62 L 204.4 546" class="slide-swimlane-sep"/><text x="490" y="40" class="slide-swimlane-title"><tspan x="490" dy="0em">财务</tspan></text><path d="M 394.8 62 L 394.8 546" class="slide-swimlane-sep"/><text x=