225" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-4-head-flow)"/><path d="M 610 225 L 674.0000071525574 225" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-4-head-flow)"/><path d="M 500 290 C 500 329.8160018024445 569.5200031471252 337 658.0000071525574 337 L 674.0000071525574 337" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-4-head-flow)"/></g><g class="slide-boxes"><g class="slide-box" data-id="start" data-shape="ellipse"><ellipse cx="90" cy="225" rx="70" ry="35" class="slide-shape" fill="#3fb8ff" stroke="none" stroke-width="3"/><text x="90" y="225" class="slide-box-label"><tspan x="90" dy="0em">开始</tspan></text></g><g class="slide-box" data-id="submit" data-shape="rect"><rect x="200" y="190" width="150" height="70" rx="20" class="slide-shape" fill="#84f0dc" stroke="none" stroke-width="3"/><text x="275" y="225" class="slide-box-label"><tspan x="275" dy="0em">提交变更</tspan></text></g><g class="slide-box" data-id="gate" data-shape="diamond"><path d="M 500 160 L 610 225 L 500 290 L 390 225 Z" stroke-linejoin="round" class="slide-shape" fill="#ffb020" stroke="none" stroke-width="3"/><text x="500" y="225" class="slide-box-label"><tspan x="500" dy="0em">审核通过？</tspan></text></g><g class="slide-box" data-id="ship" data-shape="pill"><rect x="680" y="193" width="120" height="64" rx="32" class="slide-shape" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="740" y="225" class="slide-box-label"><tspan x="740" dy="0em">上线</tspan></text><circle class="slide-badge-dot" cx="780.019" cy="212.981" r="11" fill="#18a058" stroke="#fff" stroke-width="2"/><text x="780.019" y="212.481" class="slide-badge" fill="#fff"><tspan x="780.019" dy="0em">✓</tspan></text></g><g class="slide-box" data-id="revise" data-shape="pill"><rect x="680" y="305" width="120" height="64" rx="32" class="slide-shape" fill="#ff3d9e" stroke="none" stroke-width="3"/><text x="740" y="337" class="slide-box-label"><tspan x="740" dy="0em">修改</tspan></text><circle cl