<svg viewBox="0 0 820 450" xmlns="http://www.w3.org/2000/svg" class="slide" role="img"><style>/* Diagram styles: white canvas, bright fills, bold labels, solid directional arrows. */
.slide { display: block; width: 100%; height: auto; background: #fff; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.slide text { dominant-baseline: central; text-anchor: middle; }
.slide-box-label { font-size: 20px; font-weight: 700; fill: #111; }
.slide-box--sm .slide-box-label { font-size: 9.5px; }
.slide-box-value { font-size: 13px; font-weight: 500; fill: #1d2125; }
.slide-box-label.is-muted, .slide-box-value.is-muted { fill: #5d6670; }
.slide-badge { font-size: 13px; font-weight: 800; }
.slide-group-title { font-size: 16px; font-weight: 700; fill: #111; }
.slide-arrow { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }
.slide-arrow--sm { stroke-width: 1.6; }
.slide-arrow--blocked { stroke: #e0245e; stroke-dasharray: 9 7; }
.slide-arrow-label { font-size: 14px; font-weight: 600; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.slide-arrow-label--blocked { fill: #c41d4f; }
.slide-note { font-size: 13px; font-weight: 500; fill: #5d6670; }
.slide-note--warn { fill: #c41d4f; font-weight: 700; }
</style><title>审核分支：四种外形</title><defs><marker id="diagram-4-head-flow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-4-head-flow-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-4-head-blocked" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><marker id="diagram-4-head-blocked-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><filter id="diagram-4-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-arrows"><path d="M 160 225 L 197 225" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-4-head-flow)"/><path d="M 350 225 L 387 225" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-4-head-flow)"/><path d="M 610 225 L 677.0000071525574 225" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-4-head-flow)"/><path d="M 500 290 C 500 330.57200180244445 570.8400031471252 337 661.0000071525574 337 L 677.0000071525574 337" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-4-head-flow)"/></g><g class="slide-boxes"><g class="slide-box" data-id="start" data-shape="ellipse"><ellipse cx="90" cy="225" rx="70" ry="35" class="slide-shape" fill="#3fb8ff" stroke="none" stroke-width="3"/><text x="90" y="225" class="slide-box-label"><tspan x="90" dy="0em">开始</tspan></text></g><g class="slide-box" data-id="submit" data-shape="rect"><rect x="200" y="190" width="150" height="70" rx="20" class="slide-shape" fill="#84f0dc" stroke="none" stroke-width="3"/><text x="275" y="225" class="slide-box-label"><tspan x="275" dy="0em">提交变更</tspan></text></g><g class="slide-box" data-id="gate" data-shape="diamond"><path d="M 500 160 L 610 225 L 500 290 L 390 225 Z" stroke-linejoin="round" class="slide-shape" fill="#ffb020" stroke="none" stroke-width="3"/><text x="500" y="225" class="slide-box-label"><tspan x="500" dy="0em">审核通过？</tspan></text></g><g class="slide-box" data-id="ship" data-shape="pill"><rect x="680" y="193" width="120" height="64" rx="32" class="slide-shape" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="740" y="225" class="slide-box-label"><tspan x="740" dy="0em">上线</tspan></text><circle cx="780.019" cy="212.981" r="11" fill="#18a058" stroke="#fff" stroke-width="2"/><text x="780.019" y="212.481" class="slide-badge" fill="#fff"><tspan x="780.019" dy="0em">✓</tspan></text></g><g class="slide-box" data-id="revise" data-shape="pill"><rect x="680" y="305" width="120" height="64" rx="32" class="slide-shape" fill="#ff3d9e" stroke="none" stroke-width="3"/><text x="740" y="337" class="slide-box-label"><tspan x="740" dy="0em">修改</tspan></text><circle cx="780.019" cy="324.981" r="11" fill="#f5a524" stroke="#fff" stroke-width="2"/><text x="780.019" y="324.681" class="slide-badge" fill="#1a1a1a"><tspan x="780.019" dy="0em">?</tspan></text></g></g><g class="slide-arrow-labels"><text x="643" y="205" class="slide-arrow-label slide-arrow-label--flow"><tspan x="643" dy="0em">通过</tspan></text><text x="555" y="305" class="slide-arrow-label slide-arrow-label--flow"><tspan x="555" dy="0em">驳回</tspan></text></g></svg>