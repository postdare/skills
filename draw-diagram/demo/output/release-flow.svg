<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" class="slide" role="img"><style>/* Diagram styles: white canvas, bright fills, bold labels, solid directional arrows. */
.slide { display: block; width: 100%; height: auto; background: #fff; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.slide text { dominant-baseline: central; text-anchor: middle; }
.slide-box-label { font-size: 20px; font-weight: 700; fill: #111; }
.slide-box--sm .slide-box-label { font-size: 9.5px; }
.slide-box-value { font-size: 13px; font-weight: 500; fill: #1d2125; }
.slide-box-label.is-muted, .slide-box-value.is-muted { fill: #5d6670; }
.slide-badge { font-size: 13px; font-weight: 800; }
.slide-group-title { font-size: 16px; font-weight: 700; fill: #111; }
.slide-arrow { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }
.slide-arrow--sm { stroke-width: 1.6; }
.slide-arrow--blocked { stroke: #e0245e; stroke-dasharray: 9 7; }
.slide-arrow-label { font-size: 14px; font-weight: 600; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.slide-arrow-label--blocked { fill: #c41d4f; }
.slide-note { font-size: 13px; font-weight: 500; fill: #5d6670; }
.slide-note--warn { fill: #c41d4f; font-weight: 700; }
</style><title>发布流水线</title><defs><marker id="diagram-1-head-flow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-1-head-flow-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-1-head-blocked" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><marker id="diagram-1-head-blocked-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><filter id="diagram-1-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-arrows"><path d="M 138 225 L 200 225" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-1-head-flow)"/><path d="M 327 225 L 389 225" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-1-head-flow)"/><path d="M 516 225 L 578 225" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-1-head-flow)"/></g><g class="slide-boxes"><g class="slide-box" data-id="commit"><rect x="14" y="190" width="124" height="70" rx="20" fill="#3fb8ff" stroke="none" stroke-width="3"/><text x="76" y="225" class="slide-box-label"><tspan x="76" dy="0em">代码提交</tspan></text></g><g class="slide-box" data-id="build"><rect x="203" y="190" width="124" height="70" rx="20" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="265" y="225" class="slide-box-label"><tspan x="265" dy="0em">自动构建</tspan></text></g><g class="slide-box" data-id="accept"><rect x="392" y="190" width="124" height="70" rx="20" fill="#ffb020" stroke="none" stroke-width="3"/><text x="454" y="225" class="slide-box-label"><tspan x="454" dy="0em">变更验收</tspan></text></g><g class="slide-box" data-id="release"><rect x="581" y="190" width="124" height="70" rx="20" fill="#ff3d9e" stroke="none" stroke-width="3"/><text x="643" y="225" class="slide-box-label"><tspan x="643" dy="0em">灰度上线</tspan></text></g></g><g class="slide-arrow-labels"><text x="170" y="206" class="slide-arrow-label slide-arrow-label--flow"><tspan x="170" dy="0em">触发</tspan></text></g></svg>