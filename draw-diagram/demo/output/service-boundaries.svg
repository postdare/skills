<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" class="slide" role="img"><style>/* Diagram styles: white canvas, bright fills, bold labels, solid directional arrows. */
.slide { display: block; width: 100%; height: auto; background: #fff; font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Microsoft YaHei", sans-serif; }
.slide text { dominant-baseline: central; text-anchor: middle; }
.slide-box-label { font-size: 20px; font-weight: 700; fill: #111; }
.slide-box--sm .slide-box-label { font-size: 9.5px; }
.slide-box-value { font-size: 13px; font-weight: 500; fill: #1d2125; }
.slide-box-label.is-muted, .slide-box-value.is-muted { fill: #5d6670; }
.slide-badge { font-size: 13px; font-weight: 800; }
.slide-group-title { font-size: 16px; font-weight: 700; fill: #111; }
.slide-arrow { fill: none; stroke: #111; stroke-width: 3.5; stroke-linejoin: round; }
.slide-arrow--sm { stroke-width: 1.6; }
.slide-arrow--blocked { stroke: #e0245e; stroke-dasharray: 9 7; }
.slide-arrow-label { font-size: 14px; font-weight: 600; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.slide-arrow-label--blocked { fill: #c41d4f; }
.slide-note { font-size: 13px; font-weight: 500; fill: #5d6670; }
.slide-note--warn { fill: #c41d4f; font-weight: 700; }
</style><title>订单与仓储边界</title><defs><marker id="diagram-3-head-flow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-3-head-flow-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#111"/></marker><marker id="diagram-3-head-blocked" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><marker id="diagram-3-head-blocked-sm" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9.9" markerHeight="9.9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#e0245e"/></marker><filter id="diagram-3-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12"/></filter></defs><g class="slide-group" data-id="platform"><rect x="20" y="20" width="920" height="500" rx="22" class="slide-shape" fill="#fff" stroke="#1b1b1b" stroke-width="1.5"/><text x="480" y="42" class="slide-group-title"><tspan x="480" dy="0em">交易平台</tspan></text></g><g class="slide-group" data-id="orders"><rect x="60" y="100" width="300" height="340" rx="22" class="slide-shape" fill="#fff" stroke="#1b1b1b" stroke-width="1.5"/><text x="210" y="122" class="slide-group-title"><tspan x="210" dy="0em">订单服务</tspan></text></g><g class="slide-group" data-id="warehouse"><rect x="600" y="100" width="300" height="340" rx="22" class="slide-shape" fill="#fff" stroke="#1b1b1b" stroke-width="1.5"/><text x="750" y="122" class="slide-group-title"><tspan x="750" dy="0em">仓储服务</tspan></text></g><g class="slide-arrows"><path d="M 310 215 L 647 215" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-3-head-flow)"/><path d="M 650 375 L 313 375" class="slide-arrow slide-arrow--flow" marker-end="url(#diagram-3-head-flow)"/></g><g class="slide-boxes"><g class="slide-box" data-id="accepted" data-shape="rect"><rect x="110" y="180" width="200" height="70" rx="20" class="slide-shape" fill="#00e5cc" stroke="none" stroke-width="3"/><text x="210" y="215" class="slide-box-label"><tspan x="210" dy="0em">接收订单</tspan></text></g><g class="slide-box" data-id="confirmed" data-shape="rect"><rect x="110" y="340" width="200" height="70" rx="20" class="slide-shape" fill="#84f0dc" stroke="none" stroke-width="3"/><text x="210" y="375" class="slide-box-label"><tspan x="210" dy="0em">确认完成</tspan></text></g><g class="slide-box" data-id="reserved" data-shape="rect"><rect x="650" y="180" width="200" height="70" rx="20" class="slide-shape" fill="#ff3d9e" stroke="none" stroke-width="3"/><text x="750" y="215" class="slide-box-label"><tspan x="750" dy="0em">预留库存</tspan></text></g><g class="slide-box" data-id="shipped" data-shape="rect"><rect x="650" y="340" width="200" height="70" rx="20" class="slide-shape" fill="#ff80c4" stroke="none" stroke-width="3"/><text x="750" y="375" class="slide-box-label"><tspan x="750" dy="0em">安排发货</tspan></text></g></g><g class="slide-arrow-labels"><text x="480" y="198" class="slide-arrow-label slide-arrow-label--flow"><tspan x="480" dy="0em">预留</tspan></text><text x="480" y="358" class="slide-arrow-label slide-arrow-label--flow"><tspan x="480" dy="0em">确认</tspan></text></g></svg>